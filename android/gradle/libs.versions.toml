[versions]
agp = "8.8.2"
kotlin = "2.1.0"
composeBom = "2025.02.00"
activityCompose = "1.10.0"
navigationCompose = "2.8.6"
lifecycle = "2.8.7"
coreKtx = "1.15.0"
credentials = "1.6.0"
