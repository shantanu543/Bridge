services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bridge_dev
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge_local
    ports:
      - "5432:5432"
    volumes:
      - bridge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d bridge_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  bridge-postgres:
